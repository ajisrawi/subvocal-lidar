<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Subvocal Lidar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0245E"/>
      <stop offset="1" stop-color="#6B2FB3"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#g)"/>
  <!-- glasses -->
  <circle cx="40" cy="42" r="15" fill="none" stroke="#fff" stroke-width="6"/>
  <circle cx="84" cy="42" r="15" fill="none" stroke="#fff" stroke-width="6"/>
  <path d="M55 41q7-6 14 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M99 38h13" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- laser emitter on the temple and its beam down to the cheek -->
  <circle cx="106" cy="38" r="5.5" fill="#fff"/>
  <path d="M104 47L86 90" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- interference fringes where the beam meets the skin -->
  <path d="M68 98q14 9 30 0" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M62 107q20 12 42 0" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" opacity=".75"/>
  <path d="M56 116q26 14 54 0" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" opacity=".5"/>
</svg>
